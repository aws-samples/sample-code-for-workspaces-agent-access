# Dependabot reads requirements.in / requirements.txt as a uv project: requirements.txt is
# generated by `uv pip compile --universal` (see requirements.in), and only Dependabot's uv
# updater regenerates it that way. The pip updater would rerun pip-compile, which drops the
# Windows-only and Python-version-gated pins.
#
# Version updates run weekly and security updates as advisories appear. Before merging one, check
# that its requirements.txt still has the `sys_platform == 'win32'` and `python_full_version` lines
# and the `uv pip compile --universal` header.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
